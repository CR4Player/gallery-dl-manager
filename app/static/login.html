<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const p = new URLSearchParams(location.search).get("theme");
      const s = (p === "light" || p === "dark" || p === "system") ? p : localStorage.getItem("gdl-theme");
      const resolved = (s === "light" || s === "dark") ? s : "light dark";
      document.querySelector('meta[name="color-scheme"]').content = resolved;
      document.documentElement.style.colorScheme = resolved;
    } catch {}
  </script>
  <title>登录与初始化 · gallery-dl</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="fl-auth-body">
  <main class="fl-auth-shell">
    <section class="fl-auth-card stack" aria-labelledby="auth-title">
      <div class="row-actions" style="gap:0.75rem;">
        <span class="fl-app-badge lg" aria-hidden="true">GDL</span>
        <div>
          <h1 id="auth-title" style="font-size:1.2rem;margin:0;">gallery-dl 控制台</h1>
          <div class="muted xs" id="auth-subtitle">正在检查登录状态…</div>
        </div>
      </div>

      <div id="auth-setup-banner" class="fl-infobar info sm hidden">
        首次初始化请在容器启动日志中查找 <code>[SETUP] SETUP_TOKEN=...</code> 一次性口令，并设置至少 6 位管理员密码。
      </div>

      <div id="auth-error-banner" class="fl-infobar danger sm hidden" role="alert" aria-live="assertive"></div>

      <form id="auth-form" class="stack" novalidate>
        <div class="field hidden" id="field-token">
          <label for="input-token">初始化口令 (Setup Token)</label>
          <input
            id="input-token"
            name="token"
            type="text"
            autocomplete="one-time-code"
            placeholder="例如 GDL-9F2A-8C11"
            aria-invalid="false"
            aria-describedby="err-token"
          >
          <div id="err-token" class="fl-error-msg">⚠ 请输入初始化口令。</div>
        </div>

        <div class="field" id="field-password">
          <label for="input-password" id="label-password">管理员密码</label>
          <span id="pw-hint" class="hint">若忘记密码，可在容器内执行 <code>--reset-web-auth</code> 重置</span>
          <div class="fl-password-row">
            <input
              id="input-password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="请输入管理员密码"
              aria-invalid="false"
              aria-describedby="pw-hint err-password"
            >
            <button
              type="button"
              class="fl-btn fl-icon-btn"
              id="btn-toggle-pw"
              aria-pressed="false"
              aria-label="显示密码"
              title="显示或隐藏密码"
            >👁</button>
          </div>
          <div id="err-password" class="fl-error-msg">⚠ 密码不能为空。</div>
        </div>

        <div class="field hidden" id="field-confirm">
          <label for="input-confirm">确认管理员密码</label>
          <input
            id="input-confirm"
            name="password2"
            type="password"
            autocomplete="new-password"
            placeholder="再次输入管理员密码"
            aria-invalid="false"
            aria-describedby="err-confirm"
          >
          <div id="err-confirm" class="fl-error-msg">⚠ 两次输入的密码不一致。</div>
        </div>

        <button type="submit" class="fl-btn accent full" id="btn-submit">登录控制台</button>
      </form>

      <div class="row-actions between" style="border-top:1px solid var(--fl-stroke-card);padding-top:0.7rem;">
        <span class="muted xs" id="auth-footer-note">会话通过 HttpOnly Cookie 在本地维护</span>
        <a class="fl-btn subtle sm hidden" id="auth-switch-link" href="/login">切换到登录</a>
      </div>
    </section>
  </main>

  <script type="module">
    const form = document.getElementById("auth-form");
    const subtitleEl = document.getElementById("auth-subtitle");
    const setupBanner = document.getElementById("auth-setup-banner");
    const errorBanner = document.getElementById("auth-error-banner");
    const fieldToken = document.getElementById("field-token");
    const fieldConfirm = document.getElementById("field-confirm");
    const inputToken = document.getElementById("input-token");
    const inputPw = document.getElementById("input-password");
    const inputConfirm = document.getElementById("input-confirm");
    const errToken = document.getElementById("err-token");
    const errPw = document.getElementById("err-password");
    const errConfirm = document.getElementById("err-confirm");
    const labelPw = document.getElementById("label-password");
    const pwHint = document.getElementById("pw-hint");
    const btnTogglePw = document.getElementById("btn-toggle-pw");
    const btnSubmit = document.getElementById("btn-submit");
    const switchLink = document.getElementById("auth-switch-link");

    let isSetup = false;

    function showBanner(msg) {
      if (!msg) {
        errorBanner.classList.add("hidden");
        errorBanner.textContent = "";
      } else {
        errorBanner.classList.remove("hidden");
        errorBanner.textContent = msg;
      }
    }

    function setValidity(input, errEl, message) {
      if (message) {
        input.setAttribute("aria-invalid", "true");
        input.classList.add("user-invalid-fallback");
        if (errEl) errEl.textContent = `⚠ ${message}`;
        return false;
      }
      input.setAttribute("aria-invalid", "false");
      input.classList.remove("user-invalid-fallback");
      return true;
    }

    function validateField(input) {
      const val = input.value;
      if (input === inputToken && isSetup) {
        return setValidity(inputToken, errToken, val.trim() ? "" : "请输入初始化口令。");
      }
      if (input === inputPw) {
        if (!val) return setValidity(inputPw, errPw, "密码不能为空。");
        if (isSetup && val.length < 6) {
          return setValidity(inputPw, errPw, "初始化密码至少需要 6 位字符。");
        }
        return setValidity(inputPw, errPw, "");
      }
      if (input === inputConfirm && isSetup) {
        if (!val) return setValidity(inputConfirm, errConfirm, "请再次输入密码以确认。");
        if (val !== inputPw.value) {
          return setValidity(inputConfirm, errConfirm, "两次输入的密码不一致。");
        }
        return setValidity(inputConfirm, errConfirm, "");
      }
      return true;
    }

    for (const input of [inputToken, inputPw, inputConfirm]) {
      input.addEventListener("blur", () => {
        if (input.value || input.getAttribute("aria-invalid") === "true") {
          validateField(input);
        }
      });
    }

    btnTogglePw.addEventListener("click", () => {
      const show = inputPw.type === "password";
      inputPw.type = show ? "text" : "password";
      btnTogglePw.setAttribute("aria-pressed", String(show));
      btnTogglePw.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
    });

    function applyMode(setupMode) {
      isSetup = Boolean(setupMode);
      fieldToken.classList.toggle("hidden", !isSetup);
      fieldConfirm.classList.toggle("hidden", !isSetup);
      setupBanner.classList.toggle("hidden", !isSetup);
      switchLink.classList.toggle("hidden", !isSetup);
      inputToken.required = isSetup;
      inputConfirm.required = isSetup;

      if (isSetup) {
        subtitleEl.textContent = "首次部署初始化 · 设置管理员口令";
        labelPw.textContent = "设置管理员密码";
        pwHint.textContent = "至少 6 位字符，初始化成功后自动登录控制台";
        inputPw.autocomplete = "new-password";
        inputPw.minLength = 6;
        inputPw.placeholder = "至少 6 位字符";
        btnSubmit.textContent = "完成初始化并进入控制台";
        setTimeout(() => inputToken.focus(), 20);
      } else {
        subtitleEl.textContent = "Fluent Design 2 · 输入管理员密码继续";
        labelPw.textContent = "管理员密码";
        pwHint.innerHTML = "若忘记密码，可在容器内执行 <code>--reset-web-auth</code> 重置";
        inputPw.autocomplete = "current-password";
        inputPw.minLength = 1;
        inputPw.placeholder = "请输入管理员密码";
        btnSubmit.textContent = "登录控制台";
        setTimeout(() => inputPw.focus(), 20);
      }
    }

    async function init() {
      const qMode = new URLSearchParams(location.search).get("mode");
      try {
        const res = await fetch("/api/auth/status");
        const st = res.ok ? await res.json() : {};
        if (st.auth_disabled || st.authenticated) {
          location.replace("/");
          return;
        }
        const wantSetup = qMode === "setup" || (qMode !== "login" && (!st.configured || location.pathname.includes("setup")));
        applyMode(wantSetup);
      } catch {
        applyMode(qMode === "setup" || location.pathname.includes("setup"));
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showBanner("");
      const ok1 = validateField(inputToken);
      const ok2 = validateField(inputPw);
      const ok3 = validateField(inputConfirm);
      if (!ok1 || !ok2 || !ok3) {
        const firstInvalid = [inputToken, inputPw, inputConfirm].find((el) => el.getAttribute("aria-invalid") === "true");
        firstInvalid?.focus();
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = isSetup ? "正在初始化…" : "正在验证…";
      try {
        const url = isSetup ? "/api/auth/setup" : "/api/auth/login";
        const body = isSetup
          ? { token: inputToken.value.trim(), password: inputPw.value }
          : { password: inputPw.value };
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Requested-With": "fetch",
          },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showBanner(data.detail || `认证失败 (HTTP ${res.status})`);
          return;
        }
        location.replace("/");
      } catch (err) {
        showBanner(err.message || "网络请求失败");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = isSetup ? "完成初始化并进入控制台" : "登录控制台";
      }
    });

    init();
  </script>
</body>
</html>
