<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const p = new URLSearchParams(location.search).get("theme");
      const s = (p === "light" || p === "dark" || p === "system") ? p : localStorage.getItem("gdl-theme");
      const resolved = (s === "light" || s === "dark") ? s : "light dark";
      document.querySelector('meta[name="color-scheme"]').content = resolved;
      document.documentElement.style.colorScheme = resolved;
    } catch {}
  </script>
  <title>gallery-dl 控制台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="fl-shell" id="fl-shell">
    <!-- ============ NavigationView pane ============ -->
    <aside class="fl-nav-pane" id="fl-nav-pane" aria-label="主导航">
      <div class="fl-nav-top">
        <div class="fl-nav-header">
          <button type="button" class="fl-icon-btn" id="fl-pane-toggle" aria-label="折叠或展开导航面板" aria-expanded="true" title="切换导航视图">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
          </button>
          <a href="#activity" class="fl-brand-lockup">
            <span class="fl-app-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5-8 4.5z"/><path d="m4 12 8 4.5 8-4.5"/><path d="m4 16.5 8 4.5 8-4.5"/></svg>
            </span>
            <span class="fl-brand-text">gallery-dl<small>Manager</small></span>
          </a>
        </div>

        <button type="button" class="fl-btn accent fl-new-btn" id="open-download-btn" title="新建即时下载">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="fl-nav-label">新建下载</span>
        </button>
      </div>

      <nav class="fl-nav-list" aria-label="功能分区">
        <a class="fl-nav-item" data-nav="activity" href="#activity" title="动态总览">
          <span class="fl-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.25" y="3.25" width="7.5" height="7.5" rx="1.6"/><rect x="13.25" y="3.25" width="7.5" height="7.5" rx="1.6"/><rect x="3.25" y="13.25" width="7.5" height="7.5" rx="1.6"/><rect x="13.25" y="13.25" width="7.5" height="7.5" rx="1.6"/></svg></span>
          <span class="fl-nav-label">动态总览</span>
        </a>
        <a class="fl-nav-item" data-nav="tasks" href="#tasks" title="定时任务">
          <span class="fl-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.25" y="5" width="17.5" height="16" rx="2.2"/><path d="M8 2.75V7M16 2.75V7M3.25 10.5h17.5"/><path d="M7.5 14.5h2M14.5 14.5h2M7.5 17.75h2M14.5 17.75h2"/></svg></span>
          <span class="fl-nav-label">定时任务</span>
          <span class="fl-badge-count hidden" id="nav-badge-tasks">0</span>
        </a>
        <a class="fl-nav-item" data-nav="runs" href="#runs" title="运行与日志">
          <span class="fl-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.75" y="4" width="18.5" height="16" rx="2.4"/><path d="m6.75 9.25 3 2.75-3 2.75M12.75 15.25h4.5"/></svg></span>
          <span class="fl-nav-label">运行与日志</span>
        </a>
        <a class="fl-nav-item" data-nav="sites" href="#sites" title="站点与凭据">
          <span class="fl-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.1 12h17.8"/><path d="M12 3a14.4 14.4 0 0 1 0 18 14.4 14.4 0 0 1 0-18Z"/></svg></span>
          <span class="fl-nav-label">站点与凭据</span>
        </a>
      </nav>

      <div class="fl-nav-footer">
        <div class="fl-nav-sep" role="separator"></div>
        <a class="fl-nav-item" data-nav="settings" href="#settings" title="系统设置">
          <span class="fl-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.2 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2.05 2.05 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55v.17a2.05 2.05 0 0 1-4.1 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2.05 2.05 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03h-.17a2.05 2.05 0 0 1 0-4.1h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.05 2.05 0 1 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.87.34H9.4a1.7 1.7 0 0 0 1.03-1.55v-.17a2.05 2.05 0 0 1 4.1 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.05 2.05 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.55 1.03h.17a2.05 2.05 0 0 1 0 4.1h-.09a1.7 1.7 0 0 0-1.55 1.03Z"/></svg></span>
          <span class="fl-nav-label">系统设置</span>
        </a>
        <button type="button" class="fl-nav-item hidden" id="logout-btn" title="退出控制台登录">
          <span class="fl-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5h4a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-4"/><path d="m9.5 16.5 4.5-4.5-4.5-4.5M14 12H3.5"/></svg></span>
          <span class="fl-nav-label">退出登录</span>
        </button>
        <div class="fl-nav-foot-note" title="Web 控制台运行正常">服务在线</div>
      </div>
    </aside>

    <!-- ============ Workspace ============ -->
    <div class="fl-workspace">
      <header class="fl-titlebar">
        <div class="fl-titlebar-left">
          <span class="fl-titlebar-title">gallery-dl 控制台</span>
          <span class="fl-titlebar-sep" aria-hidden="true"></span>
          <span class="fl-caption" id="version-line">gallery-dl · exiftool</span>
        </div>

        <div class="fl-titlebar-actions">
          <div class="fl-seg-group compact" id="theme-switcher" role="group" aria-label="界面主题">
            <button type="button" class="fl-seg-btn" data-theme="system" aria-pressed="true" title="跟随系统主题" aria-label="跟随系统主题">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.75" y="3.75" width="18.5" height="12.5" rx="2"/><path d="M8.5 20.25h7M12 16.25v4"/></svg>
            </button>
            <button type="button" class="fl-seg-btn" data-theme="light" aria-pressed="false" title="浅色主题" aria-label="浅色主题">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.5v2M12 19.5v2M4.7 4.7l1.4 1.4M17.9 17.9l1.4 1.4M2.5 12h2M19.5 12h2M4.7 19.3l1.4-1.4M17.9 6.1l1.4-1.4"/></svg>
            </button>
            <button type="button" class="fl-seg-btn" data-theme="dark" aria-pressed="false" title="深色主题" aria-label="深色主题">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 14.4A8.6 8.6 0 0 1 9.6 3.8 8.6 8.6 0 1 0 20.2 14.4Z"/></svg>
            </button>
          </div>

          <button type="button" id="scheduler-pill" class="fl-status-btn running" data-paused="0" title="点击暂停或恢复全局定时调度">
            <span class="fl-status-dot" aria-hidden="true"></span>
            <span id="scheduler-pill-text">调度运行中</span>
          </button>

          <button type="button" id="alerts-bell-btn" class="fl-btn subtle sm fl-bell-btn" popovertarget="alerts-popover" aria-label="通知与异常告警" title="通知中心">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8.4a6 6 0 1 0-12 0c0 7-2.8 8.6-2.8 8.6h17.6S18 15.4 18 8.4Z"/><path d="M13.7 20.6a2 2 0 0 1-3.4 0"/></svg>
            <span>通知</span>
            <span id="alerts-unread-badge" class="fl-badge-count hidden">0</span>
          </button>

          <div id="alerts-popover" popover="auto" class="fl-flyout alerts-popover">
            <div class="fl-flyout-head">
              <div>
                <strong class="sm">通知中心</strong>
                <span id="alerts-pop-count" class="muted xs"></span>
              </div>
              <div class="row-actions">
                <button type="button" class="fl-btn subtle xs" id="alerts-read-all-btn">全部已读</button>
                <button type="button" class="fl-btn subtle xs" id="alerts-clear-all-btn">清空</button>
              </div>
            </div>
            <div id="alerts-pop-list" class="fl-alerts-list"></div>
          </div>
        </div>
      </header>

      <main id="app-main" class="fl-main" tabindex="-1">
        <div class="fl-infobar">
          <span class="infobar-icon"><span class="spinner"></span></span>
          <div class="infobar-body">正在载入控制台…</div>
        </div>
      </main>
    </div>
  </div>

  <!-- ============ Mobile bottom navigation ============ -->
  <nav class="fl-mobile-nav" aria-label="移动端主导航">
    <a class="fl-mobile-item" data-nav="activity" href="#activity" aria-label="动态总览">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.25" y="3.25" width="7.5" height="7.5" rx="1.6"/><rect x="13.25" y="3.25" width="7.5" height="7.5" rx="1.6"/><rect x="3.25" y="13.25" width="7.5" height="7.5" rx="1.6"/><rect x="13.25" y="13.25" width="7.5" height="7.5" rx="1.6"/></svg>
      <span>动态</span>
    </a>
    <a class="fl-mobile-item" data-nav="tasks" href="#tasks" aria-label="定时任务">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.25" y="5" width="17.5" height="16" rx="2.2"/><path d="M8 2.75V7M16 2.75V7M3.25 10.5h17.5"/></svg>
      <span>任务</span>
    </a>
    <a class="fl-mobile-item" data-nav="runs" href="#runs" aria-label="运行与日志">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.75" y="4" width="18.5" height="16" rx="2.4"/><path d="m6.75 9.25 3 2.75-3 2.75M12.75 15.25h4.5"/></svg>
      <span>运行</span>
    </a>
    <a class="fl-mobile-item" data-nav="sites" href="#sites" aria-label="站点与凭据">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.1 12h17.8"/><path d="M12 3a14.4 14.4 0 0 1 0 18 14.4 14.4 0 0 1 0-18Z"/></svg>
      <span>站点</span>
    </a>
    <button type="button" class="fl-mobile-add" id="open-download-btn-mobile" aria-label="新建下载">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a class="fl-mobile-item" data-nav="settings" href="#settings" aria-label="系统设置">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.2 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2.05 2.05 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55v.17a2.05 2.05 0 0 1-4.1 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2.05 2.05 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03h-.17a2.05 2.05 0 0 1 0-4.1h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.05 2.05 0 1 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.87.34H9.4a1.7 1.7 0 0 0 1.03-1.55v-.17a2.05 2.05 0 0 1 4.1 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.05 2.05 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.55 1.03h.17a2.05 2.05 0 0 1 0 4.1h-.09a1.7 1.7 0 0 0-1.55 1.03Z"/></svg>
      <span>设置</span>
    </a>
  </nav>

  <!-- ============ Acrylic side panel: new download ============ -->
  <dialog id="download-drawer" class="fl-side-panel" closedby="any" aria-labelledby="download-drawer-title">
    <form id="new-download-form" class="fl-panel-form" novalidate>
      <div class="fl-panel-head">
        <div>
          <h1 id="download-drawer-title" class="fl-dialog-title">新建下载</h1>
          <div class="muted xs" style="margin-top:4px;">立即入队执行，不影响已有的定时任务</div>
        </div>
        <button type="button" id="download-drawer-close" class="fl-icon-btn" aria-label="关闭面板">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="fl-panel-body stack" style="gap:16px;">
        <div class="drawer-section-note">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.2M12 7.9h.01"/></svg>
          <span>自动匹配站点域名并校验凭据健康状态；多链接自动走 <code>-i</code> 输入模式</span>
        </div>

        <div class="field">
          <label for="nd-urls">目标 URL</label>
          <span id="nd-urls-hint" class="hint">每行一个链接，支持一次粘贴整个列表</span>
          <textarea id="nd-urls" rows="5" autofocus placeholder="https://x.com/..." aria-describedby="nd-urls-hint"></textarea>
        </div>

        <div id="nd-site-status" class="stack xs-gap hidden"></div>

        <div class="field nd-list-source">
          <div class="nd-list-head">
            <label>批量链接列表（可选）</label>
            <div class="fl-seg-group" id="nd-list-source-seg" role="group" aria-label="批量列表来源">
              <button type="button" class="fl-seg-btn" data-source="local" aria-pressed="true">上传本地 .txt</button>
              <button type="button" class="fl-seg-btn" data-source="nas" aria-pressed="false">选择 NAS 列表</button>
            </div>
          </div>

          <div id="nd-pane-local" class="stack xs-gap">
            <div class="file-picker-row">
              <input id="nd-file" type="file" accept=".txt,text/plain" class="fl-file-input" aria-label="上传本地 .txt 链接列表">
              <button type="button" class="fl-btn subtle xs hidden" id="nd-file-clear">清除</button>
            </div>
            <span class="hint">仅在本次提交时解析入队，不会写入 NAS /data/inputs/</span>
            <div id="nd-file-status" class="xs muted hidden"></div>
          </div>

          <div id="nd-pane-nas" class="stack xs-gap hidden">
            <select id="nd-input-file" aria-label="选择 NAS 列表">
              <option value="">不使用 NAS 列表</option>
            </select>
            <span class="hint">读取 /data/inputs/ 下已保存的链接列表</span>
          </div>
        </div>

        <div class="field">
          <label for="nd-name">任务标签</label>
          <input id="nd-name" type="text" placeholder="例如：今日临时下载">
        </div>

        <details id="nd-advanced-details" class="fl-expander">
          <summary class="fl-expander-head">高级选项与生效配置预览</summary>
          <div id="nd-options-slot" class="fl-expander-body stack"></div>
        </details>
      </div>

      <div class="fl-panel-foot">
        <label class="switch-inline">
          <input type="checkbox" switch role="switch" id="nd-simulate">
          <span>仅模拟试跑</span>
        </label>
        <div class="row-actions">
          <button type="button" class="fl-btn" id="nd-cancel-btn">取消</button>
          <button type="submit" class="fl-btn accent" id="nd-submit-btn">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11.5"/><path d="m6.8 10.3 5.2 5.2 5.2-5.2"/><path d="M4.5 20.5h15"/></svg>
            加入下载队列
          </button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- ============ ContentDialog ============ -->
  <dialog id="confirm-dialog" class="fl-content-dialog" closedby="closerequest" aria-labelledby="confirm-dialog-title">
    <form method="dialog" class="fl-cdialog-form">
      <div class="fl-cdialog-body stack">
        <div class="row-actions" style="gap:10px; align-items:flex-start;">
          <span class="card-head-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20.2h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4.2M12 16.9h.01"/></svg>
          </span>
          <div>
            <h1 id="confirm-dialog-title" class="fl-dialog-title">确认操作</h1>
            <p id="confirm-dialog-message" class="muted sm" style="margin:6px 0 0;"></p>
          </div>
        </div>
      </div>
      <div class="fl-cdialog-foot">
        <button type="submit" id="confirm-dialog-ok" value="confirm" class="fl-btn accent">确定</button>
        <button type="submit" value="cancel" class="fl-btn" autofocus>取消</button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="fl-toast-region" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
