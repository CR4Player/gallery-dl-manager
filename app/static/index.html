<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const saved = localStorage.getItem("color-scheme");
      document.querySelector('meta[name="color-scheme"]').content =
        (saved === "light" || saved === "dark") ? saved : "light dark";
    } catch {}
  </script>
  <title>gallery-dl-manager</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <span class="brand-badge">GDL</span>
        <span>
          <strong>gallery-dl-manager</strong>
          <span class="version-line muted" id="version-line">加载中…</span>
        </span>
      </a>

      <nav class="nav-links" aria-label="主导航">
        <a class="nav-link" data-nav="activity" href="#/">动态</a>
        <a class="nav-link" data-nav="tasks" href="#/tasks">任务</a>
        <a class="nav-link" data-nav="runs" href="#/runs">运行</a>
        <a class="nav-link" data-nav="sites" href="#/sites">站点</a>
        <a class="nav-link" data-nav="settings" href="#/settings/general">设置</a>
      </nav>

      <div class="topbar-actions">
        <button type="button" id="open-download-btn" class="btn primary sm">＋ 新下载</button>
        <button type="button" id="scheduler-pill" class="pill-btn" title="切换全局定时调度状态" data-paused="0">调度中</button>
        <button type="button" id="alerts-bell-btn" class="btn ghost sm bell-btn" popovertarget="alerts-popover" aria-label="通知与异常告警" title="异常告警与通知">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="alerts-unread-badge" class="bell-badge hidden">0</span>
        </button>
        <div id="alerts-popover" popover="auto" class="alerts-popover">
          <div class="alerts-pop-head">
            <strong>异常与通知 <span id="alerts-pop-count" class="muted sm"></span></strong>
            <div class="row-actions">
              <button type="button" class="btn ghost sm" id="alerts-read-all-btn">全部已读</button>
              <button type="button" class="btn ghost sm" id="alerts-clear-all-btn">清空</button>
            </div>
          </div>
          <div id="alerts-pop-list" class="alerts-pop-list"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="app-main" class="container" tabindex="-1">
    <div class="notice muted">正在加载控制台…</div>
  </main>

  <nav class="bottom-nav" aria-label="移动端主导航">
    <a class="bottom-nav-link" data-nav="activity" href="#/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>动态</span>
    </a>
    <a class="bottom-nav-link" data-nav="tasks" href="#/tasks">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>任务</span>
    </a>
    <a class="bottom-nav-link" data-nav="runs" href="#/runs">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      <span>运行</span>
    </a>
    <a class="bottom-nav-link" data-nav="sites" href="#/sites">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>站点</span>
    </a>
    <a class="bottom-nav-link" data-nav="settings" href="#/settings/general">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.82 1 1.48 1.05H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>设置</span>
    </a>
  </nav>

  <!-- SLIDE-OVER DRAWER: NEW DOWNLOAD -->
  <dialog id="download-drawer" class="drawer-dialog" closedby="any" aria-labelledby="download-drawer-title">
    <form id="new-download-form" class="drawer-form" novalidate>
      <div class="drawer-head">
        <div>
          <h1 id="download-drawer-title" class="dialog-title">新下载</h1>
          <div class="muted sm">立即入队执行，不影响已有定时任务</div>
        </div>
        <button type="button" id="download-drawer-close" class="btn ghost sm dialog-close" aria-label="关闭抽屉">✕</button>
      </div>

      <div class="drawer-body stack">
        <div class="field">
          <label for="nd-urls">目标 URL（每行一个）</label>
          <span id="nd-urls-hint" class="hint">粘贴链接后将自动识别站点并检查凭据健康状态；多链接支持自动走 <code>-i</code></span>
          <textarea id="nd-urls" rows="4" autofocus placeholder="https://x.com/..." aria-describedby="nd-urls-hint"></textarea>
        </div>

        <div id="nd-site-status" class="stack xs-gap hidden"></div>

        <div class="form-grid-2">
          <div class="field">
            <label for="nd-file">或上传本地 .txt 链接列表</label>
            <div class="file-picker-row">
              <input id="nd-file" type="file" accept=".txt,text/plain" class="file-input">
              <button type="button" class="btn ghost sm hidden" id="nd-file-clear">清除</button>
            </div>
            <div id="nd-file-status" class="sm muted hidden"></div>
          </div>

          <div class="field">
            <label for="nd-input-file">或使用 NAS 列表 (/data/inputs/)</label>
            <select id="nd-input-file">
              <option value="">不使用 NAS 列表</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="nd-name">任务标签名称（可选）</label>
          <input id="nd-name" type="text" placeholder="临时下载">
        </div>

        <details id="nd-advanced-details" class="sub-panel">
          <summary class="details-summary">高级选项与生效配置</summary>
          <div id="nd-options-slot" class="stack" style="margin-top:0.75rem;"></div>
        </details>
      </div>

      <div class="drawer-foot">
        <label class="checkbox-inline">
          <input type="checkbox" switch role="switch" id="nd-simulate"> 仅模拟试跑
        </label>
        <div class="row-actions">
          <button type="button" class="btn ghost" id="nd-cancel-btn">取消</button>
          <button type="submit" class="btn primary" id="nd-submit-btn">加入下载队列</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- CONFIRMATION DIALOG -->
  <dialog id="confirm-dialog" closedby="closerequest" aria-labelledby="confirm-dialog-title">
    <form method="dialog" class="dialog-form stack">
      <div class="dialog-head">
        <h1 id="confirm-dialog-title" class="dialog-title">确认操作</h1>
      </div>
      <p id="confirm-dialog-message" class="muted" style="margin:0;"></p>
      <div class="dialog-foot">
        <button type="submit" value="cancel" class="btn ghost" autofocus>取消</button>
        <button type="submit" id="confirm-dialog-ok" value="confirm" class="btn primary">确定</button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
