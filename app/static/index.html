<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const p = new URLSearchParams(location.search).get("theme");
      const s = (p === "light" || p === "dark" || p === "system") ? p : localStorage.getItem("gdl-theme");
      const resolved = (s === "light" || s === "dark") ? s : "light dark";
      document.querySelector('meta[name="color-scheme"]').content = resolved;
      document.documentElement.style.colorScheme = resolved;
    } catch {}
  </script>
  <title>gallery-dl 控制台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="fl-shell" id="fl-shell">
    <!-- WinUI 3 NavigationView Pane -->
    <aside class="fl-nav-pane" id="fl-nav-pane" aria-label="主导航">
      <div class="fl-nav-top">
        <div class="fl-nav-header">
          <button type="button" class="fl-icon-btn" id="fl-pane-toggle" aria-label="折叠或展开导航面板" aria-expanded="true" title="切换导航视图">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
          </button>
          <a href="#activity" class="fl-brand-lockup">
            <span class="fl-app-badge" aria-hidden="true">GDL</span>
            <span class="fl-brand-text">gallery-dl</span>
          </a>
        </div>

        <button type="button" class="fl-btn accent fl-new-btn" id="open-download-btn" title="新建即时下载">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg>
          <span class="fl-nav-label">新下载</span>
        </button>
      </div>

      <nav class="fl-nav-list" aria-label="功能分区">
        <a class="fl-nav-item" data-nav="activity" href="#activity">
          <span class="fl-nav-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
          <span class="fl-nav-label">动态总览</span>
        </a>
        <a class="fl-nav-item" data-nav="tasks" href="#tasks">
          <span class="fl-nav-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
          <span class="fl-nav-label">定时任务</span>
          <span class="fl-badge-count hidden" id="nav-badge-tasks">0</span>
        </a>
        <a class="fl-nav-item" data-nav="runs" href="#runs">
          <span class="fl-nav-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></span>
          <span class="fl-nav-label">运行与日志</span>
        </a>
        <a class="fl-nav-item" data-nav="sites" href="#sites">
          <span class="fl-nav-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <span class="fl-nav-label">站点与凭据</span>
        </a>
      </nav>

      <div class="fl-nav-footer">
        <div class="fl-nav-sep" role="separator"></div>
        <a class="fl-nav-item" data-nav="settings" href="#settings">
          <span class="fl-nav-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.82 1 1.48 1.05H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          <span class="fl-nav-label">系统设置</span>
        </a>
        <button type="button" class="fl-nav-item hidden" id="logout-btn" title="退出控制台登录">
          <span class="fl-nav-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></span>
          <span class="fl-nav-label">退出登录</span>
        </button>
      </div>
    </aside>

    <!-- Layered Application Frame -->
    <div class="fl-workspace">
      <header class="fl-titlebar">
        <div class="fl-titlebar-left">
          <span class="fl-caption muted" id="version-line">gallery-dl · exiftool</span>
        </div>

        <div class="fl-titlebar-actions">
          <div class="fl-seg-group compact" id="theme-switcher" role="group" aria-label="界面主题">
            <button type="button" class="fl-seg-btn" data-theme="system" aria-pressed="true" title="跟随系统明暗主题">自动</button>
            <button type="button" class="fl-seg-btn" data-theme="light" aria-pressed="false" title="浅色主题">浅色</button>
            <button type="button" class="fl-seg-btn" data-theme="dark" aria-pressed="false" title="深色主题">深色</button>
          </div>

          <button type="button" id="scheduler-pill" class="fl-status-btn running" data-paused="0" title="点击暂停或恢复全局定时调度">
            <span class="fl-status-dot" aria-hidden="true"></span>
            <span id="scheduler-pill-text">调度运行中</span>
          </button>

          <button type="button" id="alerts-bell-btn" class="fl-btn subtle sm fl-bell-btn" popovertarget="alerts-popover" aria-label="通知与异常告警" title="通知中心">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span>通知</span>
            <span id="alerts-unread-badge" class="fl-badge-count hidden">0</span>
          </button>

          <div id="alerts-popover" popover="auto" class="fl-flyout alerts-popover">
            <div class="fl-flyout-head">
              <div>
                <strong>通知中心</strong>
                <span id="alerts-pop-count" class="muted xs"></span>
              </div>
              <div class="row-actions">
                <button type="button" class="fl-btn subtle xs" id="alerts-read-all-btn">全部已读</button>
                <button type="button" class="fl-btn subtle xs" id="alerts-clear-all-btn">清空</button>
              </div>
            </div>
            <div id="alerts-pop-list" class="fl-alerts-list"></div>
          </div>
        </div>
      </header>

      <main id="app-main" class="fl-main" tabindex="-1">
        <div class="fl-infobar">正在加载控制台…</div>
      </main>
    </div>
  </div>

  <!-- Mobile Bottom Bar -->
  <nav class="fl-mobile-nav" aria-label="移动端主导航">
    <a class="fl-mobile-item" data-nav="activity" href="#activity">动态</a>
    <a class="fl-mobile-item" data-nav="tasks" href="#tasks">任务</a>
    <a class="fl-mobile-item" data-nav="runs" href="#runs">运行</a>
    <a class="fl-mobile-item" data-nav="sites" href="#sites">站点</a>
    <a class="fl-mobile-item" data-nav="settings" href="#settings">设置</a>
    <button type="button" class="fl-btn accent sm" id="open-download-btn-mobile" aria-label="新建下载">＋</button>
  </nav>

  <!-- Fluent Acrylic Side Panel: New Download -->
  <dialog id="download-drawer" class="fl-side-panel" closedby="any" aria-labelledby="download-drawer-title">
    <form id="new-download-form" class="fl-panel-form" novalidate>
      <div class="fl-panel-head">
        <div>
          <h1 id="download-drawer-title" class="fl-dialog-title">新下载任务</h1>
          <div class="muted xs">立即入队执行，不影响已有定时任务</div>
        </div>
        <button type="button" id="download-drawer-close" class="fl-icon-btn" aria-label="关闭面板">✕</button>
      </div>

      <div class="fl-panel-body stack">
        <div class="field">
          <label for="nd-urls">目标 URL（每行一个）</label>
          <span id="nd-urls-hint" class="hint">自动匹配站点域名并校验凭据健康状态；多链接自动走 <code>-i</code></span>
          <textarea id="nd-urls" rows="4" autofocus placeholder="https://x.com/..." aria-describedby="nd-urls-hint"></textarea>
        </div>

        <div id="nd-site-status" class="stack xs-gap hidden"></div>

        <div class="form-grid-2">
          <div class="field">
            <label for="nd-file">上传本地 .txt 链接列表</label>
            <div class="file-picker-row">
              <input id="nd-file" type="file" accept=".txt,text/plain" class="fl-file-input">
              <button type="button" class="fl-btn subtle xs hidden" id="nd-file-clear">清除</button>
            </div>
            <div id="nd-file-status" class="xs muted hidden"></div>
          </div>

          <div class="field">
            <label for="nd-input-file">或选择 NAS 列表 (/data/inputs/)</label>
            <select id="nd-input-file">
              <option value="">不使用 NAS 列表</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="nd-name">任务标签名称（可选）</label>
          <input id="nd-name" type="text" placeholder="临时下载">
        </div>

        <details id="nd-advanced-details" class="fl-expander">
          <summary class="fl-expander-head">高级选项与生效配置预览</summary>
          <div id="nd-options-slot" class="fl-expander-body stack"></div>
        </details>
      </div>

      <div class="fl-panel-foot">
        <label class="switch-inline">
          <input type="checkbox" switch role="switch" id="nd-simulate">
          <span>仅模拟试跑</span>
        </label>
        <div class="row-actions">
          <button type="button" class="fl-btn" id="nd-cancel-btn">取消</button>
          <button type="submit" class="fl-btn accent" id="nd-submit-btn">加入下载队列</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- WinUI 3 ContentDialog -->
  <dialog id="confirm-dialog" class="fl-content-dialog" closedby="closerequest" aria-labelledby="confirm-dialog-title">
    <form method="dialog" class="fl-cdialog-form">
      <div class="fl-cdialog-body stack">
        <h1 id="confirm-dialog-title" class="fl-dialog-title">确认操作</h1>
        <p id="confirm-dialog-message" class="muted sm" style="margin:0;"></p>
      </div>
      <div class="fl-cdialog-foot">
        <button type="submit" id="confirm-dialog-ok" value="confirm" class="fl-btn accent">确定</button>
        <button type="submit" value="cancel" class="fl-btn" autofocus>取消</button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="fl-toast-region" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
